services:
  app:
    build: .
    container_name: school_management_api
    restart: unless-stopped
    ports:
      - "${USER_PORT:-3000}:${USER_PORT:-3000}"
    env_file:
      - .env                          # loads all secrets + base config from .env
    environment:
      # Override localhost URLs with Docker service names
      MONGO_URI: mongodb://mongo:27017/school_management
      CACHE_REDIS: redis://redis:6379
      CORTEX_REDIS: redis://redis:6379
      ENV: development
    volumes:
      - .:/app                        # mount source for nodemon hot-reload
      - /app/node_modules             # preserve container's node_modules
    depends_on:
      - mongo
      - redis
    networks:
      - app_network

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app_network

volumes:
  mongo_data:
  redis_data:

networks:
  app_network:
    driver: bridge
