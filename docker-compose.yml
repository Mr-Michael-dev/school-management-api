services:

  # ---- Development (hot-reload, bind-mount, nodemon) ----
  app-dev:
    profiles: [dev]
    build:
      context: .
      target: development
    container_name: school_management_api
    restart: unless-stopped
    ports:
      - "${USER_PORT:-3000}:${USER_PORT:-3000}"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/school_management
      CACHE_REDIS: redis://redis:6379
      CORTEX_REDIS: redis://redis:6379
      ENV: development
    volumes:
      - .:/app                  # bind-mount for hot-reload
      - /app/node_modules       # preserve container's node_modules
    depends_on:
      - mongo
      - redis
    networks:
      - app_network

  # ---- Production (node, no bind-mount, no devDependencies) ----
  app-prod:
    profiles: [prod]
    build:
      context: .
      target: production
    container_name: school_management_api
    restart: unless-stopped
    ports:
      - "${USER_PORT:-3000}:${USER_PORT:-3000}"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/school_management
      CACHE_REDIS: redis://redis:6379
      CORTEX_REDIS: redis://redis:6379
      ENV: production
    depends_on:
      - mongo
      - redis
    networks:
      - app_network

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app_network

volumes:
  mongo_data:
  redis_data:

networks:
  app_network:
    driver: bridge
